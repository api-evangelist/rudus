name: Rudus
description: >-
  Rudus is a Y Combinator (Spring 2026) startup building an AI-powered takeoff and
  estimation platform for concrete contractors and subcontractors. The software
  automatically detects and classifies concrete structures (footings, walls, columns,
  and slabs) from architectural plan sets, expands them into detailed assembly line
  items, and integrates into existing estimator workflows rather than replacing them.
  Rudus reports a 70-80% reduction in takeoff and estimation time, letting estimators
  submit more bids. Founded by Rishi Pankhaniya (ex-Airbnb) and Sahil Goel (ex-Amazon).
  As of this enrichment pass Rudus operates a lead-generation marketing site at
  rudus.ai with no public developer program, API, documentation, or self-service
  sign-up; this profile records that verified state.
